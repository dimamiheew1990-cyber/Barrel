plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: '1.21.1', neoforge_version: neoforge_version,
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.register('sourceZip', Zip) {
    group = 'distribution'
    description = 'Packages the complete Gradle source project.'
    archiveClassifier = 'sources-project'
    from('.') {
        exclude '.gradle/**', '.jdks/**', '.tmp/**', 'build/**', 'run/**', '.git/**'
    }
}

tasks.build.dependsOn tasks.sourceZip
